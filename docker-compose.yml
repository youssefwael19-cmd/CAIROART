services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "8787"
      DATA_DIR: /app/data
      # Caddy is the only thing in front of the app and rewrites the forwarded
      # address, so the throttle can trust it.
      TRUST_PROXY: "1"
      # Set DATABASE_URL in .env to use Postgres; empty keeps SQLite in ./data.
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./data:/app/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
